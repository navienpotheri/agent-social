name: CI

on:
  push:
    branches: [main, event-log]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The TypeScript packages: typecheck, every package's tests, and the conformance vectors are the ones the generator produces.
  # Linux with Node 24 is the reference and must pass. The other combinations (Node 22.18, the declared minimum, and Windows, where the author works)
  # are marked experimental until each has been seen passing: a failure there shows in the run but does not fail it (docs/gaps-register.md O14).
  node:
    name: node (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24", experimental: false }
          - { os: ubuntu-latest, node: "22.18", experimental: true }
          - { os: windows-latest, node: "24", experimental: true }
          - { os: windows-latest, node: "22.18", experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Conformance vectors are up to date
        shell: bash
        run: |
          npm run vectors
          git diff --exit-code conformance/vectors

  # The Python SDK runs the same vectors. 3.11 is the declared minimum.
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", experimental: false }
          - { os: ubuntu-latest, python: "3.11", experimental: true }
          - { os: windows-latest, python: "3.12", experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "./python[dev]"
      - run: python -m pytest
        working-directory: python

  # The event log against real Postgres, the reference store.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    services:
      postgres:
        # The AWS public mirror of the official image: Docker Hub refuses anonymous pulls from shared runners once its rate limit is hit.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: asp
          POSTGRES_PASSWORD: asp-local-dev
          POSTGRES_DB: asp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asp -d asp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ASP_TEST_DATABASE_URL: postgres://asp:asp-local-dev@127.0.0.1:5432/asp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @agent-social/asp-log
      - run: npm test -w @agent-social/asp-cli
