name: CI

on:
  push:
    branches: [main, event-log]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The TypeScript packages: typecheck, every package's tests, and the conformance vectors are the ones the generator produces.
  # Every combination must pass: Linux and Windows, Node 24 and 22.18 (the declared minimum). An `experimental: true` entry shows a failure in the run
  # without failing it; use it for a combination being tried (docs/gaps-register.md O14).
  node:
    name: node (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24", experimental: false }
          - { os: ubuntu-latest, node: "22.18", experimental: false }
          - { os: windows-latest, node: "24", experimental: false }
          - { os: windows-latest, node: "22.18", experimental: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Conformance vectors are up to date
        shell: bash
        run: |
          npm run vectors
          git diff --exit-code conformance/vectors

  # The Python SDK runs the same vectors. 3.11 is the declared minimum. Same rule as above.
  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", experimental: false }
          - { os: ubuntu-latest, python: "3.11", experimental: false }
          - { os: windows-latest, python: "3.12", experimental: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "./python[dev]"
      - run: python -m pytest
        working-directory: python

  # The event log against real Postgres, the reference store.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The AWS public mirror of the official image: Docker Hub refuses anonymous pulls from shared runners once its rate limit is hit.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: asp
          POSTGRES_PASSWORD: asp-local-dev
          POSTGRES_DB: asp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asp -d asp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ASP_TEST_DATABASE_URL: postgres://asp:asp-local-dev@127.0.0.1:5432/asp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @agent-social/asp-log
      - run: npm test -w @agent-social/asp-cli

  # The first minutes on each common machine and shell (docs/live-run-clean-install.md; UC-226, UC-227, UC-02): a fresh checkout, install, help, a question in words, a governed local session whose
  # network call is refused with how to allow it, and the history, with stand-ins for the model and Claude Code. macOS and zsh are here because most developers at a conference have them.
  # It does not test the Google sign-in or a real agent: those are tried by hand.
  smoke:
    name: first minutes (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash, run: bash }
          - { os: macos-latest, shell: bash, run: bash }
          - { os: macos-latest, shell: zsh, run: "zsh {0}" }
          - { os: windows-latest, shell: bash, run: bash }
          - { os: windows-latest, shell: pwsh, run: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
      - run: npm ci
      - name: The first minutes
        run: node evals/smoke-first-minutes.mjs
      # `npm link` is what makes plain `asp` a command (README). It depends on where the machine keeps global packages, so it is tried here without failing the job.
      - name: asp as a command (npm link)
        continue-on-error: true
        working-directory: packages/asp-cli
        run: |
          npm link
          asp help

  # An old Node must get one clear sentence, not "Unknown file extension .ts" (UC-02). Node 20 is the one most people still have.
  old-node:
    name: old Node (20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node evals/smoke-first-minutes.mjs --old-node

  # One check to require. The matrix jobs have many names (node (windows-latest, node 22.18), ...), so branch protection requires this single, stable one:
  # it passes only when every job above passed. Settings > Branches > main > required status checks: all-green.
  all-green:
    name: all-green
    if: always()
    needs: [node, python, postgres, smoke, old-node]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo "node: ${{ needs.node.result }}, python: ${{ needs.python.result }}, postgres: ${{ needs.postgres.result }}, smoke: ${{ needs.smoke.result }}, old-node: ${{ needs.old-node.result }}"
          test "${{ needs.node.result }}" = "success" && test "${{ needs.python.result }}" = "success" && test "${{ needs.postgres.result }}" = "success" && test "${{ needs.smoke.result }}" = "success" && test "${{ needs.old-node.result }}" = "success"
