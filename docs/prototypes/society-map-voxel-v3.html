<title>Society Map v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept: the same spacious Chennai-inspired voxel city on a 176-block square, now laid out on the owner's drawn road plan (v1): right-angle roads of width 4, painted exactly as drawn. Every building has an entry door (green sign) and an exit door (orange sign) joined to the nearest plan road by short spurs; houses line the south-east housing district on both sides of the long roads; agents walk a graph built from the plan (split at crossings and where an end touches another road). The river, sea, hill, shadows, day and night are unchanged. */
:root{--bg:#f3efe6;--ink:#2a2420;--muted:#6b5f55;--panel:#fbf8f1;--line:#d9cfbf;--accent:#b5472f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--ink:#ece6da;--muted:#a19a8e;--panel:#1d2226;--line:#333b40;--accent:#e0805f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--ink:#ece6da;--muted:#a19a8e;--panel:#1d2226;--line:#333b40;--accent:#e0805f;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;gap:8px}
h1{font:600 18px/1.2 "Space Grotesk","Inter",sans-serif;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.sub{color:var(--muted);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;flex:1;min-height:340px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#cfe3e6}
canvas{display:block;width:100%;height:100%;touch-action:none}
.feed{position:absolute;left:8px;bottom:8px;max-width:min(380px,72%);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;pointer-events:none}
.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed b{color:var(--accent);font-weight:600}
.count{position:absolute;right:8px;top:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
</style>

    <button id="night" aria-pressed="false">Night</button><button id="green" aria-pressed="false">Greenery</button></div>
</div>
<div class="chips" id="chips" role="group" aria-label="Places"></div>
<div class="stage" id="stage"><div class="count" id="count"></div><div class="feed" id="feed" aria-live="polite"></div></div>

  cv.addEventListener("wheel", function (e) { e.preventDefault(); goalDist = Math.max(35, Math.min(300, goalDist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: false });
  var chips = document.getElementById("chips");
  function chip(text, fn) { var b = document.createElement("button"); b.textContent = text; b.onclick = fn; chips.appendChild(b); }
  chip("Whole city", function () { goal.set(0, 0, 0); goalDist = 190; });
  SPEC.forEach(function (s) { chip(s.n, function () { goal.set(s.x, heightAt(s.x, s.z), s.z); goalDist = 62; }); });
  document.getElementById("p8").onclick = function () { setPop(8); }; document.getElementById("p100").onclick = function () { setPop(100); }; document.getElementById("p1000").onclick = function () { setPop(1000); };
  document.getElementById("green").onclick = function () { var on = this.getAttribute("aria-pressed") !== "true"; this.setAttribute("aria-pressed", String(on)); setGreen(on); };
  document.getElementById("night").onclick = function () {
    night = !night; this.setAttribute("aria-pressed", String(night)); scene.background.set(night ? NIGHT : DAY); scene.fog.color.set(night ? NIGHT : DAY);
    amb.intensity = night ? 0.28 : 0.62; sun.intensity = night ? 0.12 : 0.95; winMat.emissive.setHex(night ? 0xffd98a : 0x000000);
  };
  window.__stats = { rej: REJ, nodes: NX.length, edges: EU.length, houses: HSPEC.length, mainNodes: ROADNODES.length, houseNames: Object.keys(INST).length };
  window.addEventListener("resize", resize); resize(); setGreen(false); setPop(100); loop();
})();
</script>
