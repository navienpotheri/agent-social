<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dark operations: tile</title><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:var(--body);line-height:1.5}a{color:var(--acc)}.wrap{max-width:var(--w);margin:0 auto;padding:var(--pad)}h1,h2{font:var(--head);margin:.2em 0 .4em}h1{font-size:var(--h1)}h2{font-size:var(--h2)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.3rem;margin:1rem 0}label{display:block;margin:.8rem 0 .25rem;font-weight:600}input[type=text],input[type=email]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--r)/1.5);padding:.6rem .7rem}.btn{display:inline-block;font:inherit;font-weight:600;background:var(--acc);color:var(--onacc);border:0;border-radius:calc(var(--r)/1.5);padding:.65rem 1.1rem;margin:.8rem .5rem 0 0}.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}.mut{color:var(--mut)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.8rem}.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem}.tile b{display:block;font:var(--head);font-size:1.9rem;color:var(--acc)}.spk{display:flex;align-items:flex-end;gap:2px;height:2.2rem;margin-top:.4rem}.spk i{flex:1;background:var(--acc);opacity:.75;min-height:2px}.bar{height:6px;background:var(--line);border-radius:3px;margin-top:.5rem}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.35rem .4rem;border-top:1px solid var(--line)}.badge{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:.05rem .55rem;color:var(--mut)}.note{font-size:.9rem;color:var(--mut);margin-top:1.4rem}.mail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.mail .hd{padding:.7rem 1.2rem;border-bottom:1px solid var(--line);color:var(--mut);font-size:.9rem}.mail .bd{padding:1.2rem 1.4rem}:root{--bg:#0b0b0d;--card:#121216;--line:#2a2a31;--fg:#d9d9de;--mut:#8d8d97;--acc:#ff8a1f;--onacc:#150a00;--body:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;--head:600 1em ui-monospace,SFMono-Regular,Consolas,monospace;--h1:1.5rem;--h2:1.05rem;--r:4px;--w:46rem;--pad:1.6rem}@media (prefers-color-scheme:light){:root{--bg:#f3f1ec;--card:#fff;--line:#d6d2c8;--fg:#1c1c1f;--mut:#5f5f68;--acc:#b8520a;--onacc:#fff}}h1,h2{letter-spacing:.06em;text-transform:uppercase}h1{color:var(--acc)}</style></head><body><div class="wrap"><h1>Atlas fleet</h1><p class="mut">26 agents &middot; this month</p><div class="tiles"><div class="tile"><span class="mut">credits spent</span><b>1,284</b><div class="bar"><i style="width:64%"></i></div><span class="mut">of 2,000 cap</span></div><div class="tile"><span class="mut">jobs done</span><b>41</b><div class="spk"><i style="height:20%"></i><i style="height:35%"></i><i style="height:30%"></i><i style="height:55%"></i><i style="height:48%"></i><i style="height:70%"></i><i style="height:62%"></i><i style="height:90%"></i><i style="height:80%"></i><i style="height:95%"></i></div></div><div class="tile"><span class="mut">flagged</span><b>3</b><span class="badge">1 node halted</span></div><div class="tile"><span class="mut">members</span><b>26</b><span class="mut">of 60</span></div></div><div class="card"><table><thead><tr><th>Group</th><th>Spend</th><th>Jobs</th><th>Flags</th></tr></thead><tbody><tr><td>reader</td><td>412</td><td>14</td><td>0</td></tr><tr><td>writer</td><td>388</td><td>12</td><td>1</td></tr><tr><td>reviewer</td><td>301</td><td>9</td><td>2</td></tr></tbody></table></div></div></body></html>
