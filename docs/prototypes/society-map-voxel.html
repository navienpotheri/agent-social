<title>Society Map Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept: a spacious Chennai-inspired voxel city on a 176-block square. Districts are far apart with green between them, joined by curved avenues radiating from a central plaza; a river winds through, the sea is on the east edge, a campus sits on a hill, and a forest guards the gateway to the wild worlds. Buildings stand on plinths, roofs are stacked and supported, shadows fall with the sun, and walkers stay on the roads. */
:root{--bg:#f3efe6;--ink:#2a2420;--muted:#6b5f55;--panel:#fbf8f1;--line:#d9cfbf;--accent:#b5472f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--ink:#ece6da;--muted:#a19a8e;--panel:#1d2226;--line:#333b40;--accent:#e0805f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--ink:#ece6da;--muted:#a19a8e;--panel:#1d2226;--line:#333b40;--accent:#e0805f;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;gap:8px}
h1{font:600 18px/1.2 "Space Grotesk","Inter",sans-serif;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.sub{color:var(--muted);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;flex:1;min-height:340px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#cfe3e6}
canvas{display:block;width:100%;height:100%;touch-action:none}
.feed{position:absolute;left:8px;bottom:8px;max-width:min(380px,72%);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;pointer-events:none}
.feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed b{color:var(--accent);font-weight:600}
.count{position:absolute;right:8px;top:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
</style>
<div class="bar">
  <div><h1>Society map</h1><div class="sub">Prototype: drag to turn and tilt, wheel or pinch to zoom, tap a place to fly there. Mock credits, not money.</div></div>
  <div class="ctl" role="group" aria-label="Controls"><span class="sub">Agents</span>
    <button id="p8" aria-pressed="false">8</button><button id="p100" aria-pressed="true">100</button><button id="p1000" aria-pressed="false">1,000</button>
    <button id="night" aria-pressed="false">Night</button><button id="green" aria-pressed="false">Greenery</button></div>
</div>
<div class="chips" id="chips" role="group" aria-label="Places"></div>
<div class="stage" id="stage"><div class="count" id="count"></div><div class="feed" id="feed" aria-live="polite"></div></div>

  leafA.castShadow = true; trunk.castShadow = true; scene.add(trunk, leafA, leafB);

  function bfs(a, b) { var q = [[a]], seen = {}; seen[a] = 1; while (q.length) { var p = q.shift(), n = p[p.length - 1]; if (n === b) return p; (adj[n] || []).forEach(function (m) { if (!seen[m]) { seen[m] = 1; q.push(p.concat(m)); } }); } return [a]; }
  var dests = Object.keys(DOORS).concat(["Housing", "Housing"]);

  var MAXA = 1000, bodies = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9, 1.3, 0.6), new THREE.MeshLambertMaterial({ color: 0xffffff }), MAXA), heads = new THREE.InstancedMesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat(0xe6b894), MAXA);
  var legs = new THREE.InstancedMesh(new THREE.BoxGeometry(0.7, 0.5, 0.4), mat(0x33384a), MAXA); bodies.castShadow = true; scene.add(bodies, heads, legs);
  var SH = [0x3b82c4, 0xd94f4f, 0x4caf7a, 0xe0a030, 0x8a5ac8, 0x2fa8a0, 0xd9608f, 0x6c7a89], agents = [], feedEl = document.getElementById("feed"), lastSay = 0;

  function routeTo(a, from, name) { var to = DOORS[name]; if (name === "Housing") to = houseNodes[(rnd() * houseNodes.length) | 0]; a.where = name; a.nodes = bfs(from, to); a.seg = 0; a.u = 0; a.dwell = 0; a.off = (rnd() - 0.5) * 2.2; }
  function mk(i) { var a = { id: i + 1, sp: 3 + rnd() * 2, t: rnd() * 9, node: Object.keys(Nd)[(rnd() * 36) | 0] }; var p = Nd[a.node]; a.x = p[0]; a.z = p[1]; a.rot = 0; routeTo(a, a.node, dests[(rnd() * dests.length) | 0]); col.setHex(SH[i % SH.length]); bodies.setColorAt(i, col); return a; }
  function setPop(n) { agents = []; for (var i = 0; i < n; i++) agents.push(mk(i)); bodies.count = n; heads.count = n; legs.count = n; bodies.instanceColor.needsUpdate = true;
    ["p8", "p100", "p1000"].forEach(function (id) { document.getElementById(id).setAttribute("aria-pressed", String(id === "p" + (n === 1000 ? 1000 : n))); }); document.getElementById("count").textContent = n.toLocaleString() + " agents in the city"; }
  var autos = []; var autoMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.8, 1.1, 2.8), mat(0xf2c200), 14); autoMesh.castShadow = true; scene.add(autoMesh);
  for (var au = 0; au < 14; au++) autos.push(mk(au + 2000)); autos.forEach(function (a) { a.sp = 7 + rnd() * 3; a.auto = true; });
  function step(a, dt, now) {
    if (a.dwell > 0) { a.dwell -= dt; if (a.dwell <= 0) { var cur = a.nodes[a.nodes.length - 1]; routeTo(a, cur, dests[(rnd() * dests.length) | 0]); } return; }

    if (!B) { if (a.auto) { routeTo(a, a.nodes[a.nodes.length - 1], dests[(rnd() * dests.length) | 0]); return; } a.dwell = 1.5 + rnd() * 3; if (!a.auto && a.id % 5 === 0) say(a.where === "Academy" ? "<b>Agent " + a.id + "</b> paid " + (5 + ((a.id * 7) % 40)) + " credits: " + courses[a.id % courses.length] : a.where === "Worlds" ? "<b>Agent " + a.id + "</b> entered a world" : "<b>Agent " + a.id + "</b> visited " + a.where); return; }
    var len = Math.hypot(B[0] - A[0], B[1] - A[1]), dx = (B[0] - A[0]) / len, dz = (B[1] - A[1]) / len; a.u += a.sp * dt;

      D.position.set(a.x, y + 1.15, a.z); D.rotation.set(0, a.rot, 0); D.scale.set(1, 1, 1); D.updateMatrix(); bodies.setMatrixAt(i, D.matrix);
      D.position.set(a.x, y + 0.25, a.z); D.updateMatrix(); legs.setMatrixAt(i, D.matrix);
      D.position.set(a.x, y + 2.15, a.z); D.updateMatrix(); heads.setMatrixAt(i, D.matrix); }
    bodies.instanceMatrix.needsUpdate = true; heads.instanceMatrix.needsUpdate = true; legs.instanceMatrix.needsUpdate = true;
    for (var k = 0; k < autos.length; k++) { var v = autos[k]; step(v, dt, t); D.position.set(v.x, heightAt(v.x, v.z) + 0.55, v.z); D.rotation.set(0, v.rot, 0); D.updateMatrix(); autoMesh.setMatrixAt(k, D.matrix); }

  }

  var chips = document.getElementById("chips");
  function chip(text, fn) { var b = document.createElement("button"); b.textContent = text; b.onclick = fn; chips.appendChild(b); }
  chip("Whole city", function () { goal.set(0, 0, 0); goalDist = 190; });
  SPEC.forEach(function (s) { chip(s.n, function () { goal.set(s.x, heightAt(s.x, s.z), s.z); goalDist = 62; }); });
  chip("Housing", function () { goal.set(36, 0, 56); goalDist = 80; }); chip("Worlds gateway", function () { goal.set(-52, 0, 60); goalDist = 62; });
